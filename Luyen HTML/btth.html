<!doctype html>
<html>
  <head>
    <title>Flappy Bird Mini</title>
    <style>
      canvas {
        border: 2px solid #333;
        display: block;
        margin: 20px auto;
        background: #70c5ce;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // 1. Khởi tạo đối tượng
      let bird = { x: 50, y: 150, w: 20, h: 20, velocity: 0 }; // tọa độ xy
      let gravity = 0.25;
      let jump = -4.6;
      let pipes = []; // Danh sách các ống nước
      let frame = 0; // Biến đếm khung hình để biết khi nào tạo ống mới

      // 2. Hàm tạo ống nước mới
      function createPipe() {
        let gap = 100; // Khoảng trống giữa 2 ống
        let topHeight = Math.random() * (canvas.height / 2);
        pipes.push({
          x: canvas.width,
          topHeight: topHeight,
          bottomHeight: canvas.height - topHeight - gap,
        });
      }

      // 3. Hàm cập nhật Logic
      function update() {
        bird.velocity += gravity;
        bird.y += bird.velocity;

        // Cứ mỗi 100 khung hình thì tạo 1 ống mới
        if (frame % 100 === 0) createPipe();

        pipes.forEach((pipe, index) => {
          pipe.x -= 2;
          // Xóa ống khi nó chạy khỏi màn hình để nhẹ máy
          if (pipe.x + 50 < 0) pipes.splice(index, 1);
        });

        if (bird.y + bird.h > canvas.height || bird.y < 0) {
          location.reload(); // Thua thì load lại trang cho nhanh
        }
        frame++;
      }

      // 4. Hàm vẽ hình
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "yellow";
        ctx.fillRect(bird.x, bird.y, bird.w, bird.h);

        ctx.fillStyle = "green";
        pipes.forEach((pipe) => {
          ctx.fillRect(pipe.x, 0, 50, pipe.topHeight);
          ctx.fillRect(
            pipe.x,
            canvas.height - pipe.bottomHeight,
            50,
            pipe.bottomHeight,
          );
        });
      }

      // 5. Vòng lặp chính (Game Loop)
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop); // Đây là lệnh tạo sự mượt mà
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") bird.velocity = jump;
      });

      // Bắt đầu chạy game
      loop();
    </script>
  </body>
</html>
