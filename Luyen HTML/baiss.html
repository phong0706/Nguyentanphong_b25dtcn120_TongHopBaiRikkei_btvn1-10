<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let count = 0;
      let loginOK = false;

      while (count < 3) {
        let user = prompt("Nhập tài khoản:");
        let pass = prompt("Nhập mật khẩu:");

        if (user === "admin" && pass === "12345") {
          alert("Đăng nhập thành công");
          loginOK = true;
          break;
        } else {
          count++;
          alert("Sai! Còn " + (3 - count) + " lần");
        }
      }

      if (!loginOK) {
        alert("Tài khoản bị khóa");
      } else {
        let choice = 0;

        while (choice !== 5) {
          choice = Number(
            prompt(
              "1. Phân loại mã sách\n" +
                "2. Vẽ kho sách\n" +
                "3. Tính phí bảo trì\n" +
                "4. Tìm mã may mắn\n" +
                "5. Thoát",
            ),
          );

          // 1. Phân loại mã sách
          if (choice === 1) {
            let even = 0;
            let odd = 0;

            while (true) {
              let id = Number(prompt("Nhập mã sách (0 để dừng):"));
              if (id === 0) break;

              if (id % 2 === 0) even++;
              else odd++;
            }

            console.log("Chẵn:", even);
            console.log("Lẻ:", odd);
          }

          // 2. Vẽ kho sách
          else if (choice === 2) {
            let r = Number(prompt("Số hàng:"));
            let c = Number(prompt("Số cột:"));

            for (let i = 1; i <= r; i++) {
              let line = "";
              for (let j = 1; j <= c; j++) {
                line += "[" + i + "-" + j + "] ";
              }
              console.log(line);
            }
          }

          // 3. Tính phí bảo trì
          else if (choice === 3) {
            let qty = Number(prompt("Số sách:"));
            let cost = Number(prompt("Phí 1 cuốn:"));
            let year = Number(prompt("Số năm:"));

            for (let i = 1; i <= year; i++) {
              console.log("Năm " + i + ": " + qty * cost);
              cost = cost * 1.1;
            }
          }

          // 4. Tìm mã may mắn
          else if (choice === 4) {
            let n = Number(prompt("Nhập N:"));
            let total = 0;

            for (let i = 1; i <= n; i++) {
              if (i % 3 === 0 && i % 5 !== 0) {
                console.log(i);
                total++;
              }
            }

            alert("Có " + total + " mã may mắn");
          } else if (choice === 5) {
            alert("Thoát chương trình");
          } else {
            alert("Chọn sai");
          }
        }
      }
    </script>
  </body>
</html>
