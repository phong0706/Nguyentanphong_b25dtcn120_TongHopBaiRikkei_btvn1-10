<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const teamHistory = [
        {
          name: "Messi",
          position: "Forward",
          nationality: "Argentina",
          seasons: {
            "2022-2023": {
              matches: 34,
              goals: 21,
              assists: 14,
              yellowCards: 3,
            },
            "2023-2024": {
              matches: 32,
              goals: 25,
              assists: 15,
              yellowCards: 2,
            },
            "2024-2025": {
              matches: 28,
              goals: 18,
              assists: 12,
              yellowCards: 1,
            },
          },
        },
        {
          name: "Ronaldo",
          position: "Forward",
          nationality: "Portugal",
          seasons: {
            "2022-2023": { matches: 30, goals: 28, assists: 8, yellowCards: 5 },
            "2023-2024": {
              matches: 35,
              goals: 30,
              assists: 10,
              yellowCards: 4,
            },
            "2024-2025": { matches: 30, goals: 22, assists: 9, yellowCards: 3 },
          },
        },
      ];

      function generatePlayerSeasonReport(playerName, teamHistory) {
        let player = teamHistory.find(function (p) {
          return p.name === playerName;
        });

        if (!player) {
          return "Không tìm thấy cầu thủ " + playerName;
        }

        let totalMatches = 0;
        let totalGoals = 0;
        let totalAssists = 0;
        let totalYellowCards = 0;

        let bestSeasonName = "";
        let bestSeasonGoals = -1;
        let bestSeasonAssists = -1;

        for (let seasonKey in player.seasons) {
          let seasonData = player.seasons[seasonKey];

          totalMatches = totalMatches + seasonData.matches;
          totalGoals = totalGoals + seasonData.goals;
          totalAssists = totalAssists + seasonData.assists;
          totalYellowCards = totalYellowCards + seasonData.yellowCards;

          if (seasonData.goals > bestSeasonGoals) {
            bestSeasonName = seasonKey;
            bestSeasonGoals = seasonData.goals;
            bestSeasonAssists = seasonData.assists;
          } else if (seasonData.goals === bestSeasonGoals) {
            if (seasonData.assists > bestSeasonAssists) {
              bestSeasonName = seasonKey;
              bestSeasonGoals = seasonData.goals;
              bestSeasonAssists = seasonData.assists;
            }
          }
        }

        let avgGoals = Number((totalGoals / totalMatches).toFixed(2));
        let avgAssists = Number((totalAssists / totalMatches).toFixed(2));

        let report = {
          name: player.name,
          position: player.position,
          nationality: player.nationality,
          careerStats: {
            totalMatches: totalMatches,
            totalGoals: totalGoals,
            totalAssists: totalAssists,
            totalYellowCards: totalYellowCards,
            averageGoalsPerMatch: avgGoals,
            averageAssistsPerMatch: avgAssists,
            bestSeason: {
              season: bestSeasonName,
              goals: bestSeasonGoals,
              assists: bestSeasonAssists,
            },
          },
        };

        return report;
      }

      console.log(generatePlayerSeasonReport("Messi", teamHistory));
    </script>
  </body>
</html>
