<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let squad = [
        { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },
        { id: 2, name: "Tran Van B", goals: 5, position: "MF" },
        { id: 3, name: "Le Van C", goals: 0, position: "DF" },
        { id: 4, name: "Pham Van D", goals: 12, position: "FW" },
        { id: 5, name: "Dang Van E", goals: 0, position: "GK" },
      ];

      while (true) {
        let menu =
          "--- FOOTBALL MANAGER PRO ---\n" +
          "1. Xem đội hình\n" +
          "2. Thêm cầu thủ\n" +
          "3. Tìm kiếm (theo ID)\n" +
          "4. Cập nhật bàn thắng\n" +
          "5. Xóa cầu thủ (Chuyển nhượng)\n" +
          "0. Thoát\n\n" +
          "Bạn chọn:";

        let choice = prompt(menu);

        // Xử lý thoát chương trình
        if (choice === "0" || choice === null) {
          console.log("Đã thoát chương trình.");
          break;
        }

        // Điều hướng các chức năng
        switch (choice) {
          case "1":
            console.log("=> DANH SÁCH:");
            squad.forEach((player) => {
              console.log(
                "Mã ${player.id} - ${player.name} (${player.position}): ${player.goals} bàn",
              );
            });
            break;

          case "2":
            let newName = prompt("Nhập tên cầu thủ:");
            let newGoals = Number(prompt("Nhập số bàn thắng:"));
            let newPosition = prompt("Nhập vị trí (FW, MF, DF, GK):");

            // Tạo ID tự động dựa trên thời gian thực để đảm bảo không bao giờ trùng lặp
            let newId = Date.now();

            let newPlayer = {
              id: newId,
              name: newName,
              goals: newGoals,
              position: newPosition,
            };

            squad.push(newPlayer);
            console.log(`=> Đã thêm cầu thủ: ${newName} với Mã ID: ${newId}`);
            break;

          case "3":
            let searchId = Number(prompt("Nhập ID cầu thủ cần tìm:"));
            let foundPlayer = squad.find((player) => player.id === searchId);

            if (foundPlayer) {
              console.log(
                `=> Đã tìm thấy: Mã ${foundPlayer.id} - ${foundPlayer.name} (${foundPlayer.position}): ${foundPlayer.goals} bàn`,
              );
            } else {
              console.log("=> Lỗi: Không tìm thấy cầu thủ.");
            }
            break;

          case "4":
            let updateId = Number(prompt("Nhập ID cầu thủ vừa ghi bàn:"));
            let playerToUpdate = squad.find((player) => player.id === updateId);

            if (playerToUpdate) {
              playerToUpdate.goals += 1;
              console.log(
                `=> Đã cập nhật: ${playerToUpdate.name} hiện có ${playerToUpdate.goals} bàn thắng.`,
              );
            } else {
              console.log("=> Lỗi: Không tìm thấy cầu thủ để cập nhật.");
            }
            break;

          case "5":
            let deleteId = Number(prompt("Nhập ID cầu thủ cần xóa:"));
            let indexToDelete = squad.findIndex(
              (player) => player.id === deleteId,
            );

            if (indexToDelete !== -1) {
              let deletedName = squad[indexToDelete].name;
              squad.splice(indexToDelete, 1);
              console.log(
                `=> Đã chuyển nhượng (xóa) thành công cầu thủ: ${deletedName}`,
              );
            } else {
              console.log("=> Lỗi: Không tìm thấy mã cầu thủ để xóa.");
            }
            break;

          default:
            console.log("=> Lựa chọn không hợp lệ, vui lòng chọn từ 0 đến 5.");
            break;
        }
      }
    </script>
  </body>
</html>
