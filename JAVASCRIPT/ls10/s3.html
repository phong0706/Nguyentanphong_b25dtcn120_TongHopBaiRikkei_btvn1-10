<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let players = [
        {
          name: "Messi",
          position: "Forward",
          age: 36,
          goals: 25,
          assists: 15,
          matches: 34,
        },
        {
          name: "Ronaldo",
          position: "Forward",
          age: 39,
          goals: 30,
          assists: 10,
          matches: 38,
        },
        {
          name: "Neymar",
          position: "Forward",
          age: 32,
          goals: 18,
          assists: 20,
          matches: 32,
        },
        {
          name: "De Bruyne",
          position: "Midfielder",
          age: 33,
          goals: 8,
          assists: 25,
          matches: 35,
        },
        {
          name: "Kante",
          position: "Midfielder",
          age: 33,
          goals: 2,
          assists: 5,
          matches: 36,
        },
        {
          name: "Van Dijk",
          position: "Defender",
          age: 33,
          goals: 5,
          assists: 3,
          matches: 33,
        },
        {
          name: "Alisson",
          position: "Goalkeeper",
          age: 31,
          goals: 0,
          assists: 1,
          matches: 37,
        },
      ];

      function getFilteredTotalGoals(minGoals, teamPlayers) {
        let totalGoals = 0;

        for (let i = 0; i < teamPlayers.length; i++) {
          let currentPlayer = teamPlayers[i];

          if (currentPlayer.goals >= minGoals) {
            totalGoals = totalGoals + currentPlayer.goals;
          }
        }

        console.log(
          "Tổng các bàn thắng của các cầu thủ đạt đủ chỉ tiêu là : " +
            totalGoals,
        );
        return totalGoals;
      }

      getFilteredTotalGoals(5, players);
      getFilteredTotalGoals(50, players);
    </script>
  </body>
</html>
