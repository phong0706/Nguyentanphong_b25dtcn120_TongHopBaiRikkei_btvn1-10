<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const players = [
        {
          name: "Messi",
          position: "Forward",
          age: 36,
          goals: 25,
          assists: 15,
          matches: 34,
          yellowCards: 2,
        },
        {
          name: "Ronaldo",
          position: "Forward",
          age: 39,
          goals: 30,
          assists: 10,
          matches: 38,
          yellowCards: 4,
        },
        {
          name: "Neymar",
          position: "Forward",
          age: 32,
          goals: 18,
          assists: 20,
          matches: 32,
          yellowCards: 3,
        },
        {
          name: "De Bruyne",
          position: "Midfielder",
          age: 33,
          goals: 8,
          assists: 25,
          matches: 35,
          yellowCards: 1,
        },
        {
          name: "Kante",
          position: "Midfielder",
          age: 33,
          goals: 2,
          assists: 5,
          matches: 36,
          yellowCards: 0,
        },
        {
          name: "Van Dijk",
          position: "Defender",
          age: 33,
          goals: 5,
          assists: 3,
          matches: 33,
          yellowCards: 2,
        },
        {
          name: "Alisson",
          position: "Goalkeeper",
          age: 31,
          goals: 0,
          assists: 1,
          matches: 37,
          yellowCards: 0,
        },
      ];

      function generateRankingReport(minMatches, teamPlayers) {
        let filteredPlayers = teamPlayers.filter(function (player) {
          return player.matches >= minMatches;
        });

        let mappedPlayers = filteredPlayers.map(function (player) {
          let perf = (player.goals + player.assists) / player.matches;
          let perfRounded = Number(perf.toFixed(2));

          let eff = perfRounded - (player.yellowCards / player.matches) * 10;
          let effRounded = Number(eff.toFixed(2));

          return {
            name: player.name,
            position: player.position,
            age: player.age,
            goals: player.goals,
            assists: player.assists,
            matches: player.matches,
            yellowCards: player.yellowCards,
            performanceScore: perfRounded,
            efficiencyScore: effRounded,
          };
        });

        mappedPlayers.sort(function (a, b) {
          if (b.efficiencyScore !== a.efficiencyScore) {
            return b.efficiencyScore - a.efficiencyScore;
          }
          if (b.performanceScore !== a.performanceScore) {
            return b.performanceScore - a.performanceScore;
          }
          if (b.goals !== a.goals) {
            return b.goals - a.goals;
          }
          return 0;
        });

        console.log("XẾP HẠNG ĐỘI BÓNG (từ " + minMatches + " trận trở lên)");

        for (let i = 0; i < mappedPlayers.length; i++) {
          let p = mappedPlayers[i];
          console.log(
            i +
              1 +
              ". " +
              p.name +
              " - Efficiency: " +
              p.efficiencyScore.toFixed(2) +
              " | Performance: " +
              p.performanceScore.toFixed(2) +
              " | Goals: " +
              p.goals,
          );
        }

        console.log("Tổng số cầu thủ xếp hạng: " + mappedPlayers.length);

        if (mappedPlayers.length > 0) {
          console.log("Cầu thủ xuất sắc nhất: " + mappedPlayers[0].name);

          let topCount = 0;
          let sumEff = 0;

          for (let i = 0; i < mappedPlayers.length; i++) {
            if (i < 3) {
              sumEff = sumEff + mappedPlayers[i].efficiencyScore;
              topCount = topCount + 1;
            }
          }

          let avgEff = sumEff / topCount;
          console.log("Trung bình efficiency top 3: " + avgEff.toFixed(2));
        }
      }

      generateRankingReport(30, players);
    </script>
  </body>
</html>
