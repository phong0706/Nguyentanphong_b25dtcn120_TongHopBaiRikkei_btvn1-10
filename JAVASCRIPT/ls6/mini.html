<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let attempts = 0; // Biến đếm số lần thử
      let isAuthenticated = false; // Đăng nhập sai sẽ off
      const ADMIN_USER = "admin";
      const ADMIN_PASS = "12345";

      while (attempts < 3) {
        // Điều kiện tối đa sai
        let user = prompt("Tên đăng nhập:");
        let pass = prompt("Mật khẩu:");

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          // So sánh & check nghiêm ngặt
          alert("Đăng nhập thành công!");
          isAuthenticated = true; // log thành công
          break;
        } else {
          attempts++;
          if (user !== ADMIN_USER) {
            // Validate
            alert(`Sai tài khoản! Còn ${3 - attempts} lần thử.`);
          } else {
            alert(`Sai mật khẩu! Còn ${3 - attempts} lần thử.`);
          }
        }
      }

      if (!isAuthenticated) {
        // Điều kiện khi nhập sai quá số lần
        alert("Tài khoản đã bị khóa!");
      } else {
        let libraries = ["Toán", "Văn", "Anh"];
        let choice;

        do {
          let menu = `--- HỆ THỐNG QUẢN TRỊ THƯ VIỆN 4.0 ---
1. Nhập thêm lô sách mới
2. Hiển thị danh sách sách
3. Tìm kiếm sách
4. Cập nhật tên sách
5. Đảo ngược thứ tự kệ sách
6. Nhập kho từ nguồn khác
7. Thoát chương trình
Vui lòng chọn (1-7):`;

          choice = Number(prompt(menu)); // Dòng này chọn menu có mới hiện cái để chọn

          switch (choice) {
            case 1: // Nhạp lô sách
              let input = prompt(
                "Nhập danh sách tên sách (cách nhau bởi dấu phẩy):",
              );
              if (input) {
                let newBooks = input.split(",");
                let countAdded = 0;
                for (let i = 0; i < newBooks.length; i++) {
                  let bookName = newBooks[i].trim();
                  if (bookName !== "") {
                    // != Nó trả về true nếu hai giá trị không bằng nhau hoặc không cùng kiểu dữ liệu
                    libraries.push(bookName);
                    countAdded++;
                  }
                }
                alert(`Đã thêm thành công ${countAdded} cuốn sách mới.`);
              }
              break;

            case 2:
              console.clear();
              console.log("--- DANH SÁCH SÁCH HIỆN CÓ ---");
              if (libraries.length === 0) {
                console.log("Thư viện hiện đang trống.");
              } else {
                for (let i = 0; i < libraries.length; i++) {
                  console.log(`${i + 1}. ${libraries[i]}`);
                }
              }
              alert("Danh sách đã được in ra console (F12).");
              break;

            case 3:
              if (libraries.length === 0) {
                alert("Ko thấy");
              } else {
                let searchName = prompt("Nhập tên cuốn sách cần tìm:");
                let foundIndex = -1;

                for (let i = 0; i < libraries.length; i++) {
                  if (libraries[i] === searchName) {
                    foundIndex = i;
                  }
                  break;
                }
              }

              if (foundIndex !== -1) {
                alert(
                  `Sách "${searchName}" được tìm thấy tại vị trí số ${foundIndex} trong mảng.`,
                );
              } else {
                alert(`Không tìm thấy sách "${searchName}" trong kho.`);
              }
              break;

            case 4:
              let oldName = prompt("Nhập tên sách cần sửa:");
              let updateIndex = -1;

              for (let i = 0; i < libraries.length; i++) {
                if (libraries[i] === oldName) {
                  updateIndex = i;
                  break;
                }
              }

              if (updateIndex !== -1) {
                let newName = prompt(
                  `Tìm thấy sách "${oldName}". Nhập tên mới:`,
                );
                if (newName) {
                  libraries[updateIndex] = newName;
                  alert("Cập nhật thành công!");
                }
              } else {
                alert("Sách không tồn tại để sửa.");
              }
              break;

            case 5:
              libraries.reverse();
              console.clear();
              console.log("--- KỆ SÁCH SAU KHI ĐẢO NGƯỢC ---");

              for (let i = 0; i < libraries.length; i++) {
                console.log(`Vị trí index [${i}]: ${libraries[i]}`);
              }
              alert("Thứ tự trên kệ đã thay đổi. Kiểm tra console.");
              break;

            case 6:
              let externalLibrary = ["Sách Kỹ Năng", "Truyện Tranh"];
              for (let i = 0; i < externalLibrary.length; i++) {
                libraries.push(externalLibrary[i]);
              }
              alert("Đã gộp kho sách từ chi nhánh khác thành công.");
              break;

            case 7:
              alert("Hẹn gặp lại!");
              break;

            default:
              alert("Lựa chọn không hợp lệ!");
              break;
          }
        } while (choice !== 7);
      }
    </script>
  </body>
</html>
