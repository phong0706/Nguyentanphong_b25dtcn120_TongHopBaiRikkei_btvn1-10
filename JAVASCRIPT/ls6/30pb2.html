<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phong S1</title>
  </head>
  <body>
    <script>
      const prieces = [100, 200, 300, 400];
      console.log("Kết quả For-of (Giá trị)");
      for (let priece of prieces) {
        console.log(priece);
      }

      // Duyệt phần tử qua for-in
      console.log("Giá trị for index");
      for (index in prieces) {
        console.log(index);
      }
    </script>
  </body>
</html>
