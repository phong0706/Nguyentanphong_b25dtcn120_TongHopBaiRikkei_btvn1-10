<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const squad = [
        ["Nguyen Van A", 10, "FW"],
        ["Tran Van B", 5, "MF"],
        ["Le Van C", 2, "DF"],
        ["Pham Van D", 12, "FW"],
        ["Hoang Van E", 0, "GK"],
        ["Dang Van F", 7, "MF"],
      ];

      function displaySquad(team) {
        team.forEach((player) => {
          console.log(`${player[0]} (${player[2]}): ${player[1]} bàn thắng`);
        });
      }

      function findPlayer(team, playerName) {
        const foundPlayer = team.find((player) => player[0] === playerName);

        if (foundPlayer) {
          console.log(
            `Đã tìm thấy: ${foundPlayer[0]} - ${foundPlayer[1]} bàn - Vị trí ${foundPlayer[2]}`,
          );
        } else {
          console.log("Lỗi: Không tìm thấy cầu thủ.");
        }
      }

      function filterByPosition(team, position) {
        const filteredPlayers = team.filter((player) => player[2] === position);

        console.log("=> KẾT QUẢ LỌC:");
        filteredPlayers.forEach((player) => {
          console.log(`- ${player[0]} (${player[1]} bàn)`);
        });
      }

      function calculateTotalGoals(team) {
        const totalGoals = team.reduce((sum, player) => sum + player[1], 0);
        console.log(`=> Tổng số bàn thắng toàn đội: ${totalGoals} bàn`);
      }

      function checkPerformance(team) {
        const hasZeroGoals = team.some((player) => player[1] === 0);
        if (hasZeroGoals) {
          console.log("Có cầu thủ chưa ghi bàn");
        }

        const allHaveGoals = team.every((player) => player[1] > 0);
        if (allHaveGoals) {
          console.log("Tất cả cầu thủ đều đã ghi bàn");
        }
      }

      function runMenu() {
        let isRunning = true;

        while (isRunning) {
          const choice = prompt(
            "--- QUẢN LÝ ĐỘI BÓNG ---\n" +
              "1. Xem danh sách\n" +
              "2. Tìm kiếm (Find)\n" +
              "3. Lọc vị trí (Filter)\n" +
              "4. Tổng bàn thắng (Reduce)\n" +
              "5. Kiểm tra hiệu suất (Some/Every)\n" +
              "0. Thoát\n\n" +
              "Bạn chọn:",
          );

          switch (choice) {
            case "1":
              displaySquad(squad);
              break;
            case "2":
              const searchName = prompt("Nhập tên cầu thủ cần tìm:");
              findPlayer(squad, searchName);
              break;
            case "3":
              const searchPosition = prompt(
                "Nhập vị trí muốn lọc (FW/MF/DF/GK):",
              );
              filterByPosition(squad, searchPosition);
              break;
            case "4":
              calculateTotalGoals(squad);
              break;
            case "5":
              checkPerformance(squad);
              break;
            case "0":
              console.log("=> Hẹn gặp lại!");
              isRunning = false;
              break;
            default:
              console.log("Lựa chọn không hợp lệ, vui lòng thử lại.");
          }
        }
      }

      runMenu();
    </script>
  </body>
</html>
