<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let books = ["Nha Gia Kim", "Dac Nhan Tam", "Tuan Lam Viec 4 Gio"];
      let isRunning = true;

      while (isRunning) {
        let menu =
          "--- THƯ VIỆN KHOA HỌC ---\n" +
          "1. Xem danh sách\n" +
          "2. Nhập sách mới\n" +
          "3. Mượn sách (Xóa)\n" +
          "4. Sửa tên sách\n" +
          "5. Sắp xếp kệ\n" +
          "0. Thoát\n\n" +
          "Bạn chọn:";

        let choice = parseInt(prompt(menu));

        if (choice === 1) {
          console.log("=> Danh sách hiện tại (" + books.length + " cuốn):");
          for (let i = 0; i < books.length; i++) {
            console.log(i + 1 + ". " + books[i]);
          }
        } else if (choice === 2) {
          let newBook = prompt("Nhập tên sách mới:");
          if (newBook) {
            books.push(newBook);
            console.log("Đã thêm thành công: " + newBook);
          }
        } else if (choice === 3) {
          let borrowName = prompt("Nhập tên sách muốn mượn:");
          let index = books.indexOf(borrowName);

          if (index !== -1) {
            books.splice(index, 1);
            console.log("Đã cho mượn cuốn '" + borrowName + "'");
          } else {
            console.log("Lỗi: Không tìm thấy sách " + borrowName + "!");
          }
        } else if (choice === 4) {
          let oldName = prompt("Nhập tên sách cũ cần sửa:");
          let index = books.indexOf(oldName);

          if (index !== -1) {
            let newName = prompt("Nhập tên mới:");
            books[index] = newName;
            console.log("Đã cập nhật: " + oldName + " -> " + newName);
          } else {
            console.log("Không tìm thấy sách: " + oldName);
          }
        } else if (choice === 5) {
          books.sort();
          console.log("Đã sắp xếp kệ sách theo bảng chữ cái.");
          console.log("Danh sách sau khi sắp xếp:");
          for (let i = 0; i < books.length; i++) {
            console.log(i + 1 + ". " + books[i]);
          }
        } else if (choice === 0) {
          console.log("Cảm ơn bạn đã sử dụng hệ thống.");
          isRunning = false;
        } else {
          console.log("Lựa chọn không hợp lệ, vui lòng chọn lại.");
        }
      }
    </script>
  </body>
</html>
