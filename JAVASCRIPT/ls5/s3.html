<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let booksId = [];
      let booksName = [];
      let inventoryQuantity = [];

      let quantity = parseInt(
        prompt("Có bao nhiêu loại sách cần kiểm tra bổ sung hôm nay?"),
      );

      if (quantity > 0) {
        for (let i = 0; i < quantity; i++) {
          let idInput = prompt("Nhập mã sách thứ " + (i + 1) + ":");
          let nameInput = prompt("Nhập tên sách thứ " + (i + 1) + ":");
          let qtyInput = parseInt(prompt("Nhập số lượng tồn kho hiện tại:"));

          booksId.push(idInput);
          booksName.push(nameInput);
          inventoryQuantity.push(qtyInput);
        }

        console.log("--- KẾT QUẢ KIỂM TRA ---");
        console.log("Tổng số loại sách đang kiểm tra: " + booksId.length);

        let lowStockCount = 0;
        console.log("Danh sách mã sách đã hết hàng (tồn kho = 0):");

        for (let i = 0; i < booksId.length; i++) {
          if (inventoryQuantity[i] <= 5) {
            lowStockCount++;
          }

          if (inventoryQuantity[i] === 0) {
            console.log(booksId[i]);
          }
        }

        console.log(
          "Số lượng sách có tồn kho <= 5 (cần ưu tiên bổ sung): " +
            lowStockCount,
        );

        console.log("Danh sách chi tiết:");
        for (let i = 0; i < booksId.length; i++) {
          console.log(
            i +
              1 +
              ". [" +
              booksId[i] +
              "] " +
              booksName[i] +
              " - SL: " +
              inventoryQuantity[i],
          );
        }
      } else {
        console.log("Vui lòng nhập số lượng hợp lệ.");
      }
    </script>
  </body>
</html>
